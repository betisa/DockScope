<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc"><title id="title">DockScope security architecture</title><desc id="desc">Renderer communicates through a typed preload bridge to Electron Main, which controls privileged Docker and Windows operations.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0A101C"/><stop offset="1" stop-color="#101827"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker></defs><rect width="1440" height="500" rx="24" fill="url(#bg)"/><g font-family="Segoe UI,Arial"><text x="64" y="58" fill="#F8FAFC" font-size="27" font-weight="750">Security-first Electron architecture</text><text x="64" y="88" fill="#64748B" font-size="15">Renderer never receives unrestricted Node, filesystem, PowerShell, WSL or Docker CLI access.</text>
<g transform="translate(64 136)"><rect width="330" height="260" rx="18" fill="#101827" stroke="#2B3A50"/><text x="24" y="36" fill="#93C5FD" font-size="13" font-weight="700">RENDERER</text><text x="24" y="68" fill="#F8FAFC" font-size="22" font-weight="750">React + TypeScript</text><text x="24" y="100" fill="#94A3B8" font-size="14">Dashboard · Workspaces · Monaco · xterm.js</text><g fill="#CBD5E1" font-size="14"><text x="24" y="145">✓ nodeIntegration: false</text><text x="24" y="174">✓ sandbox: true</text><text x="24" y="203">✓ contextIsolation: true</text><text x="24" y="232">✓ no child_process / fs</text></g></g>
<g transform="translate(514 176)"><rect width="314" height="178" rx="18" fill="#102033" stroke="#315078"/><text x="24" y="38" fill="#67E8F9" font-size="13" font-weight="700">PRELOAD</text><text x="24" y="72" fill="#F8FAFC" font-size="21" font-weight="750">Typed IPC Bridge</text><text x="24" y="105" fill="#94A3B8" font-size="14">Explicit commands · validated identifiers</text><text x="24" y="136" fill="#94A3B8" font-size="14">stream sessions · PTY sessions · events</text></g>
<g transform="translate(948 116)"><rect width="428" height="300" rx="18" fill="#101827" stroke="#2B3A50"/><text x="24" y="36" fill="#86EFAC" font-size="13" font-weight="700">ELECTRON MAIN</text><text x="24" y="68" fill="#F8FAFC" font-size="22" font-weight="750">Privileged Operations</text><g font-size="14"><rect x="24" y="96" width="178" height="44" rx="10" fill="#142235"/><text x="41" y="124" fill="#CBD5E1">Docker / Compose CLI</text><rect x="218" y="96" width="178" height="44" rx="10" fill="#142235"/><text x="235" y="124" fill="#CBD5E1">node-pty / ConPTY</text><rect x="24" y="154" width="178" height="44" rx="10" fill="#142235"/><text x="41" y="182" fill="#CBD5E1">WSL / VHDX bridge</text><rect x="218" y="154" width="178" height="44" rx="10" fill="#142235"/><text x="235" y="182" fill="#CBD5E1">Operational Intel</text><rect x="24" y="212" width="178" height="44" rx="10" fill="#142235"/><text x="41" y="240" fill="#CBD5E1">Settings / Profiles</text><rect x="218" y="212" width="178" height="44" rx="10" fill="#142235"/><text x="235" y="240" fill="#CBD5E1">Audit / Recovery</text></g></g><path d="M394 266 H506" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/><path d="M828 266 H940" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/><text x="420" y="247" fill="#64748B" font-size="12">safe API</text><text x="858" y="247" fill="#64748B" font-size="12">invoke</text><text x="64" y="458" fill="#64748B" font-size="13">Destructive operations remain explicit, confirmation-driven, and auditable. Safe Cleanup never includes persistent volumes.</text></g></svg>