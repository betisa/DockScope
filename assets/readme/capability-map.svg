<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="260" viewBox="0 0 1440 260" role="img" aria-labelledby="title desc"><title id="title">DockScope capability map</title><desc id="desc">Runtime, Compose, Storage, BuildKit, Cleanup, Operations and Audit surfaces.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#3B82F6"/><stop offset=".5" stop-color="#22C55E"/><stop offset="1" stop-color="#06B6D4"/></linearGradient></defs><rect width="1440" height="260" rx="24" fill="url(#bg)"/><text x="56" y="54" fill="#F8FAFC" font-family="Segoe UI,Arial" font-size="25" font-weight="750">One workspace. Seven operational surfaces.</text><text x="56" y="82" fill="#64748B" font-family="Segoe UI,Arial" font-size="15">From “why is Docker using 80 GB?” to “why is this container unhealthy?” without changing tools.</text><rect x="56" y="104" width="1328" height="3" rx="2" fill="url(#line)" opacity=".65"/><g font-family="Segoe UI,Arial">
<g transform="translate(56 130)"><rect width="174" height="82" rx="14" fill="#111C2C" stroke="#293A53"/><text x="18" y="30" fill="#93C5FD" font-size="12" font-weight="700">RUNTIME</text><text x="18" y="57" fill="#E2E8F0" font-size="16" font-weight="700">Logs · Stats · PTY</text></g><g transform="translate(244 130)"><rect width="174" height="82" rx="14" fill="#111C2C" stroke="#293A53"/><text x="18" y="30" fill="#93C5FD" font-size="12" font-weight="700">COMPOSE</text><text x="18" y="57" fill="#E2E8F0" font-size="16" font-weight="700">Services · YAML</text></g><g transform="translate(432 130)"><rect width="174" height="82" rx="14" fill="#111C2C" stroke="#293A53"/><text x="18" y="30" fill="#67E8F9" font-size="12" font-weight="700">STORAGE</text><text x="18" y="57" fill="#E2E8F0" font-size="16" font-weight="700">Disk · VHDX</text></g><g transform="translate(620 130)"><rect width="174" height="82" rx="14" fill="#111C2C" stroke="#293A53"/><text x="18" y="30" fill="#67E8F9" font-size="12" font-weight="700">BUILDKIT</text><text x="18" y="57" fill="#E2E8F0" font-size="16" font-weight="700">Cache · Layers</text></g><g transform="translate(808 130)"><rect width="174" height="82" rx="14" fill="#111C2C" stroke="#293A53"/><text x="18" y="30" fill="#86EFAC" font-size="12" font-weight="700">CLEANUP</text><text x="18" y="57" fill="#E2E8F0" font-size="16" font-weight="700">Safe · Preview</text></g><g transform="translate(996 130)"><rect width="174" height="82" rx="14" fill="#111C2C" stroke="#293A53"/><text x="18" y="30" fill="#86EFAC" font-size="12" font-weight="700">OPERATIONS</text><text x="18" y="57" fill="#E2E8F0" font-size="16" font-weight="700">Alerts · Tray</text></g><g transform="translate(1184 130)"><rect width="174" height="82" rx="14" fill="#111C2C" stroke="#293A53"/><text x="18" y="30" fill="#C4B5FD" font-size="12" font-weight="700">AUDIT</text><text x="18" y="57" fill="#E2E8F0" font-size="16" font-weight="700">History · Recovery</text></g></g></svg>