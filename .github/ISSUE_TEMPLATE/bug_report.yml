name: Bug report
description: Report a reproducible DockScope defect
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials or sensitive Diagnostics Bundle content.
  - type: input
    id: version
    attributes:
      label: DockScope version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Docker Desktop / Engine version
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package type
      options:
        - NSIS installed
        - Portable
        - Development build
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, passwords, connection strings, and private paths when necessary.
