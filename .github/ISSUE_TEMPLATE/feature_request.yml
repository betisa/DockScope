name: Feature request
description: Propose a focused DockScope capability
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operational problem should DockScope solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed workflow
      description: Describe the user workflow rather than only the UI.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Security / destructive-operation impact
      description: Does this need Docker writes, filesystem access, secrets, shell/PTY, or deletion?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
